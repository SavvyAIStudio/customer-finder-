<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customer Finder</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf7f2;--card:#fff;--ink:#2a2320;--mute:#756a62;--line:#e8dfd4;--acc:#b5541c;--accink:#fff;--soft:#f6e9dd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1614;--card:#262019;--ink:#f3ece4;--mute:#a89b90;--line:#3a3128;--acc:#e8894a;--accink:#1b1614;--soft:#33271d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1614;--card:#262019;--ink:#f3ece4;--mute:#a89b90;--line:#3a3128;--acc:#e8894a;--accink:#1b1614;--soft:#33271d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;line-height:1.2;margin:8px 0 6px}
h2{font-size:18px;margin:0 0 10px}
p.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
label small{font-weight:400;color:var(--mute)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px}
textarea{min-height:72px;resize:vertical}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px;width:100%;margin-top:16px;background:var(--acc);color:var(--accink);cursor:pointer}
button:disabled{opacity:.6}
.pill{display:inline-block;background:var(--soft);color:var(--acc);font-weight:700;border-radius:99px;padding:3px 11px;font-size:13px}
ul{margin:6px 0 0;padding-left:20px}li{margin:4px 0}
.item{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.item:first-of-type{border:0;padding:0;margin:0}
.mute{color:var(--mute)}
.pick{width:auto;display:inline-block;margin:8px 0 0;padding:9px 14px;font-size:14px;background:var(--soft);color:var(--acc)}
.err{color:#c0392b}
.note{font-size:14px;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Customer Finder</h1>
<p class="sub">Find out who will buy, where to reach them, what to post, and what to do in your first 30 days.</p>

<div class="card" id="form">
  <label for="product">What do you want to sell? <small>(or leave blank if you’re not sure yet)</small></label>
  <textarea id="product" placeholder="e.g. A budgeting planner for new moms"></textarea>
  <label for="niche">Your niche <small>(optional)</small></label>
  <input id="niche" placeholder="e.g. personal finance">
  <label for="aud">Who do you want to serve? <small>(optional)</small></label>
  <input id="aud" placeholder="e.g. stay-at-home moms in Ghana">
  <label for="about">About you <small>(skills, interests, problems you’ve solved; helps if you don’t know your niche)</small></label>
  <textarea id="about" placeholder="e.g. I worked in insurance, I love saving money, I’m a mom of three"></textarea>
  <button id="go">Build my plan</button>
</div>

<div id="out"></div>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var out=$('out'),go=$('go');
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
  function list(a){return '<ul>'+(a||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'}

  function render(r){
    var h='';
    if(r.niche_suggestions&&r.niche_suggestions.length){
      h+='<div class="card"><h2>1. Niche and audience ideas</h2><p class="note">Tap one to rerun the plan with it.</p>';
      r.niche_suggestions.forEach(function(n,i){
        h+='<div class="item"><b>'+esc(n.niche)+'</b><div class="mute">For: '+esc(n.audience)+'</div><div>'+esc(n.why)+'</div>'+
        '<button class="pick" data-i="'+i+'">Use this</button></div>';
      });
      h+='</div>';
    }
    if(r.chosen){
      h+='<div class="card"><h2>Your focus</h2><div><b>'+esc(r.chosen.niche)+'</b></div><div class="mute">'+esc(r.chosen.audience)+'</div></div>';
    }
    var v=r.verdict||{};
    h+='<div class="card"><h2>Product check</h2><span class="pill">'+esc(v.rating)+'</span><p>'+esc(v.summary)+'</p>'+
      '<b>Strengths</b>'+list(v.strengths)+'<div style="height:8px"></div><b>Risks</b>'+list(v.risks)+'<div style="height:8px"></div><b>How to improve it</b>'+list(v.improvements)+'</div>';
    h+='<div class="card"><h2>Where to find customers</h2>';
    (r.where||[]).forEach(function(w){h+='<div class="item"><b>'+esc(w.platform)+'</b><div>'+esc(w.why)+'</div><div class="mute">'+esc(w.how)+'</div></div>'});
    h+='</div><div class="card"><h2>What to post</h2>';
    (r.content||[]).forEach(function(c){h+='<div class="item"><b>'+esc(c.angle)+'</b><div class="mute">“'+esc(c.example)+'”</div></div>'});
    h+='</div><div class="card"><h2>Your first 30 days</h2>';
    (r.plan||[]).forEach(function(p){h+='<div class="item"><b>'+esc(p.week)+': '+esc(p.focus)+'</b>'+list(p.actions)+'</div>'});
    h+='</div><div class="card"><h2>Validate before you build</h2><p class="note">This is an informed opinion, not proof of demand. Test it for real:</p>'+list(r.validate)+'</div>';
    out.innerHTML=h;
    out.querySelectorAll('.pick').forEach(function(b){
      b.onclick=function(){
        var n=r.niche_suggestions[+b.dataset.i];
        $('niche').value=n.niche;$('aud').value=n.audience;
        window.scrollTo({top:0,behavior:'smooth'});run();
      };
    });
  }

  async function run(){
    var product=$('product').value.trim(),niche=$('niche').value.trim(),aud=$('aud').value.trim(),about=$('about').value.trim();
    if(!product&&!niche&&!about){out.innerHTML='<p class="err">Please fill in at least one box so I have something to work with.</p>';return}
    go.disabled=true;go.textContent='Working on it…';
    out.innerHTML='<p class="mute">Building your plan. This can take up to a minute.</p>';
    var sample=null;
    try{sample=await claude.use('sample')}catch(e){}
    if(!sample){out.innerHTML='<p class="err">The AI helper isn’t available in this view. Try opening the page from your Claude app.</p>';go.disabled=false;go.textContent='Build my plan';return}
    var needNiche=!niche||!aud;
    var prompt='You are a practical, honest online-business coach for beginners who work only from a phone, many in Africa. Be specific, simple, and realistic. Never promise sales.\n'+
    'User input:\nProduct idea: '+(product||'(none)')+'\nNiche: '+(niche||'(unknown)')+'\nAudience: '+(aud||'(unknown)')+'\nAbout them: '+(about||'(none)')+'\n\n'+
    (needNiche?'The niche and/or audience is missing. Give 3 niche_suggestions (niche, audience, why) based on their input, then base the rest of the plan on the best one.':'Set niche_suggestions to an empty array.')+
    '\nReturn ONLY JSON with this shape:\n{"niche_suggestions":[{"niche":"","audience":"","why":""}],"chosen":{"niche":"","audience":""},'+
    '"verdict":{"rating":"Strong | Promising | Risky | Unclear","summary":"2 sentences on whether people need and pay for this","strengths":["",""],"risks":["",""],"improvements":["","",""]},'+
    '"where":[{"platform":"","why":"where these buyers hang out","how":"exactly how to approach them there"}],'+
    '"content":[{"angle":"","example":"a ready-to-post hook or caption"}],'+
    '"plan":[{"week":"Week 1","focus":"","actions":["","",""]}],"validate":["","",""]}\n'+
    'Rules: exactly 3 platforms, 5 content items, 4 weeks in the plan with 3-4 actions each, 3 validate steps. Suit a phone-only creator on a small budget. Keep each string short.';
    try{
      var r=await sample.json(prompt,{modelTier:'default'});
      render(r);
    }catch(e){
      out.innerHTML='<p class="err">Something went wrong'+(e&&e.code==='not_granted'?' (permission was not granted)':'')+'. Please try again.</p>';
    }
    go.disabled=false;go.textContent='Build my plan';
  }
  go.onclick=run;
})();
</script>
</body>
  </html>
